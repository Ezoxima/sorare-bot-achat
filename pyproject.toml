[project]
name = "acheteur"
version = "0.1.0"
description = "Bot d'achat automatique de cartes Sorare sous-évaluées."
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "keyring>=25.0",
    "bcrypt>=4.1",
    "eth-account>=0.14",
    "ecdsa>=0.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["acheteur*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
